[project]
name = "goldbot"
version = "0.1.0"
description = "Risk-first, fail-closed gold trading system (local, Exness MT5 Standard Cent)"
requires-python = ">=3.13,<3.14"  # the MetaTrader5 wheel does not support 3.14 yet
dependencies = [
  "pydantic>=2.9",
  "structlog>=24.4",
  "keyring>=25.4",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
  "referencing>=0.35",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]

[project.scripts]
goldbot = "goldbot.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "hypothesis>=6.112",
  "ruff>=0.7",
  "pyright>=1.1.385",
  "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goldbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["mt5: needs a running MT5 terminal on a Windows host"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["src/goldbot"]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DTZ", "RUF"]
ignore = ["S101"]  # asserts are allowed in tests and self-checks

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"tools/**" = ["RUF001"]  # en dashes are intentional in generated Markdown

[tool.pyright]
include = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
strict = ["src/goldbot/core"]
