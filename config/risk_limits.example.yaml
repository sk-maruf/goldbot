# GoldBot risk limits: EXAMPLE FILE (M0b).
#
# This is an example only. The engine reads config/risk_limits.yaml, which the user creates from
# this file. Every value below is copied from specifications/TRADING_RISK_SPEC.md §2 (the parameter
# register, single source of truth). If this file and the register ever differ, the register wins.
#
# - Nothing in this file is approved. Every approved_by_user is false (RISK-092). An approval is
#   never inferred from a fixture value or a recommendation.
# - USER_DECISION_REQUIRED parameters have value: null until the user chooses a value and records
#   approved_by_user: true, approved_on: "YYYY-MM-DD" (quoted) and a reason. While any of them is
#   unapproved, the engine refuses to start in LIVE, and in DEMO outside fixture demo (RISK-005,
#   RISK-066).
# - PROPOSED parameters carry the register's engineering default in value. The user approves or
#   changes them; until then they stay PROPOSED.
# - BROKER_VERIFICATION_REQUIRED parameters stay null until measured live in the milestone named.
# - The dashboard may only move a parameter in its ui_direction. Loosening any parameter needs an
#   edit of config/risk_limits.yaml, a restart and a typed confirmation; the diff is shown and
#   logged (RISK-090). No LLM, MCP, API command, Guardian or strategy can change a P-xx (RISK-091).
# - Loss and drawdown thresholds are intervention triggers. They do not bound the loss: prices can
#   gap, and a stop-loss does not fix the exit price (RISK-040, RISK-041).
# - Decimal quantities are quoted strings so that no float parsing occurs (RISK-020..024).
# - ui_direction "widen only" (P-18, P-19, P-33) means the window may only get longer, which is the
#   stricter direction for those parameters. "none" stands for "—" in the register.

schema_version: "1.0.0"

